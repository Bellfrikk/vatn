<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Målerstand</title>

<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#fff; padding:16px; }
  h1{text-align:center;}
  form{display:grid;gap:10px;margin-bottom:20px;}
  input,button{padding:12px;font-size:16px;border-radius:6px;border:none;}
  button{background:#3fa9f5;font-weight:bold;cursor:pointer;}
  .status{text-align:center;margin:10px 0;}
  .list{display:grid;gap:10px;}
  .card{background:#1c1c1c;padding:12px;border-radius:8px;}
  .dato{font-weight:bold;}
  .bruk{color:#7dd87d;}
  .muted{color:#aaa;font-size:14px;}
  canvas{background:#222;border-radius:8px;margin-top:20px;}
</style>
</head>
<body>

<h1>Målerstand</h1>

<form id="skjema">
  <input type="date" id="dato" required>
  <input type="number" id="malarstand" placeholder="Målerstand" required>
  <input type="text" id="kommentar" placeholder="Kommentar (valgfri)">
  <button type="submit">Lagre</button>
</form>

<div class="status" id="status"></div>
<canvas id="graf" width="400" height="200"></canvas>

<div class="list" id="liste"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>


const form = document.getElementById("skjema");
const status = document.getElementById("status");
let listeData = [];
const liste = document.getElementById("liste");
const datoInput = document.getElementById("dato");
const malarstandInput = document.getElementById("malarstand");
const kommentarInput = document.getElementById("kommentar");
const grafCtx = document.getElementById("graf").getContext("2d");

datoInput.valueAsDate = new Date();
let chart = null;

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  status.textContent = "Lagrer...";
  const nyMaal = Number(malarstandInput.value);

  // Hent siste måling
  const { data: sisteData, error: fetchError } = await db
    .from("vatn")
    .select("målerstand")
    .order("dato",{ascending:false})
    .limit(1);

  if(fetchError){
    status.textContent = "Feil ved henting av siste måling";
    return;
  }

  const sisteMaal = sisteData?.[0]?.målerstand ?? 0;

  if(nyMaal < sisteMaal){
    const bekreft = confirm(`Denne målerstanden (${nyMaal}) er lavere enn sist registrerte (${sisteMaal}). Er du sikker?`);
    if(!bekreft){
      status.textContent = "Avbrutt";
      return;
    }
  }

  const { error } = await db
    .from("vatn")
    .insert([{ dato: datoInput.value, målerstand: nyMaal, kommentar: kommentarInput.value }]);

  if(error){
    status.textContent = "❌ " + error.message;
  } else {
    status.textContent = "✅ Lagra";
    form.reset();
    datoInput.valueAsDate = new Date();
    hentMalingar();
  }
});

async function hentMalingar(){
  const { data, error } = await db
    .from("vatn")
    .select("*")
    .order("dato",{ascending:true}); // stigande for graf

  if(error){
    liste.textContent = "Feil ved lasting";
    return;
  }

  liste.innerHTML = "";
  const labels = [];
  const forbrukData = [];

  for(let i=0;i<data.length;i++){
    const curr = data[i];
    const prev = data[i-1];
    labels.push(curr.dato);

    let brukText = "–";
    let daglig = 0;
    if(prev){
      const diff = curr.målerstand - prev.målerstand;
      const dager = Math.round((new Date(curr.dato) - new Date(prev.dato))/86400000);
      if(dager>0){
        daglig = diff/dager;
        brukText = daglig.toFixed(2);
      }
    }
    forbrukData.push(daglig);


    listeData.push(`<div class="dato">${curr.dato}: ${curr.målerstand} (${brukText})  ${curr.kommentar ?? ""}</div>`);
  }
  //snur rekkefølge på lista for visning
  listeData = [...listeData].reverse();
  listeData.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = item;
    liste.appendChild(card);
  });

  // Oppdater graf
  if(chart) chart.destroy();
  chart = new Chart(grafCtx,{
    type:"line",
    data:{
      labels: labels,
      datasets:[
        { label:"Liter/dag", data:forbrukData, borderColor:"#7dd87d", backgroundColor:"rgba(125,216,125,0.2)", tension:0.3 }
      ]
    },
    options:{
      responsive:true,
      plugins:{legend:{labels:{color:"#fff"}}},
      scales:{x:{ticks:{color:"#fff"}}, y:{ticks:{color:"#fff"}}}
    }
  });
}

hentMalingar();
</script>
</body>
</html>
